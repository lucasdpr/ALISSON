<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alisson — Nossa História</title>
<meta name="description" content="16 anos de história de Alisson e Erica, contados em fotos e vídeos. Tem surpresa no final 🎂">
<meta name="theme-color" content="#120d0b">
<meta property="og:type" content="website">
<meta property="og:url" content="https://alisson-theta.vercel.app/">
<meta property="og:title" content="Alisson & Erica — Nossa História">
<meta property="og:description" content="16 anos de história contados em fotos e vídeos. Tem surpresa no final 🎂">
<meta property="og:image" content="https://alisson-theta.vercel.app/fotos/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lobster&family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!-- fundo: a foto atual desfocada, trocando em crossfade -->
<div class="fundo" aria-hidden="true"><div class="bg a"></div><div class="bg b"></div><div class="veu"></div></div>
<canvas id="coracoes" aria-hidden="true"></canvas>
<div class="progresso" aria-hidden="true"><span></span></div>
<button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu">☰ capítulos</button>
<nav class="menu" id="menu" hidden aria-label="Capítulos"><ol></ol></nav>
<div class="contador" aria-live="polite"><small>ano</small><b id="ano">2010</b></div>

<header class="cena intro">
  <p class="maquina" id="maquina"></p>
  <h1 id="nome"></h1>
  <p class="casal" id="casal"></p>
  <p class="desde" id="desde"></p>
  <p class="aniv" id="aniv" hidden></p>
  <p class="role">role devagar ↓</p>
</header>

<main id="historia"></main>

<section id="aniversario" class="aniversario" aria-label="Feliz aniversário">
  <canvas id="fogos" aria-hidden="true"></canvas>
  <div class="ceu" id="ceu">
    <h2 class="aniv-titulo"><span class="brilho" aria-hidden="true">✨</span><span class="arco">Feliz Aniversário</span><span class="brilho" aria-hidden="true">✨</span><small>meu amor</small></h2>
    <div class="bolo-area" id="bolo-area">
      <button class="bolo" id="bolo" type="button" aria-label="Soprar as velas do bolo">
        <span class="velas">
          <span class="vela"><i class="chama"></i><i class="fumaca"></i></span>
          <span class="vela"><i class="chama"></i><i class="fumaca"></i></span>
          <span class="vela"><i class="chama"></i><i class="fumaca"></i></span>
        </span>
        <span class="andar andar-2"></span>
        <span class="andar andar-1"></span>
        <span class="prato"></span>
      </button>
      <p class="bolo-dica" id="bolo-dica">faça um pedido e toque no bolo para soprar as velas 🕯️</p>
      <button class="soprar-mic" id="soprar-mic" type="button">🎤 ou sopre de verdade no microfone</button>
    </div>
    <div class="ceu-rodape">
      <p class="olhe">olhe para o céu… 🎆</p>
      <button class="som-fogos" id="som-fogos" type="button">🔈 ligar o som dos fogos</button>
    </div>
  </div>
  <div class="aniv-conteudo">
    <div class="aniv-foto-box"><div class="aniv-foto-wrap"><img id="aniv-foto" alt="Alisson no pôr do sol"><canvas id="fogos-foto" aria-hidden="true"></canvas></div></div>
    <div class="envelope" id="envelope">
      <button class="env" id="env-btn" type="button" aria-expanded="false" aria-controls="carta">
        <span class="env-fundo"></span>
        <span class="env-papel"></span>
        <span class="env-frente"><span class="env-para" id="env-para"></span></span>
        <span class="env-aba"></span>
        <span class="env-selo" aria-hidden="true">❤</span>
      </button>
      <p class="env-dica">toque no envelope para abrir 💌</p>
    </div>
    <article class="carta" id="carta" hidden>
      <div id="carta-texto"></div>
      <p id="carta-assinatura" class="assinatura-carta"></p>
    </article>
    <p class="toque-fogos">toque na tela para mais fogos 🎆</p>
  </div>
</section>

<section class="cena fim">
  <div id="final-video"></div>
  <p class="maquina">…e a história continua.</p>
  <p class="assinatura" id="assinatura"></p>
  <button id="replay">↺ ver de novo</button>
</section>

<dialog id="zoom" aria-label="Foto ampliada">
  <div class="zoom-palco"><img class="zoom-img" alt=""></div>
  <button class="zoom-fechar" type="button" aria-label="Fechar">×</button>
  <button class="zoom-prev" type="button" aria-label="Foto anterior">‹</button>
  <button class="zoom-next" type="button" aria-label="Próxima foto">›</button>
  <p class="zoom-cont"></p>
</dialog>
<script src="dados.js"></script>
<script src="app.js"></script>
<script src="aniversario.js"></script>
</body>
</html>
