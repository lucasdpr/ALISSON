<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alisson — Nossa História</title>
<meta name="description" content="A história de Alisson Henrique e Erica Ricardo, contada em fotos desde 2010.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!-- fundo: a foto atual desfocada, trocando em crossfade -->
<div class="fundo" aria-hidden="true"><div class="bg a"></div><div class="bg b"></div><div class="veu"></div></div>
<canvas id="coracoes" aria-hidden="true"></canvas>
<div class="progresso" aria-hidden="true"><span></span></div>
<div class="contador" aria-live="polite"><small>ano</small><b id="ano">2010</b></div>

<header class="cena intro">
  <p class="maquina" id="maquina"></p>
  <h1 id="nome"></h1>
  <p class="casal" id="casal"></p>
  <p class="aniv" id="aniv" hidden></p>
  <p class="role">role devagar ↓</p>
</header>

<main id="historia"></main>

<section class="cena fim">
  <div id="final-video"></div>
  <p class="maquina">…e a história continua.</p>
  <p class="assinatura" id="assinatura"></p>
  <button id="replay">↺ ver de novo</button>
</section>

<dialog id="zoom"><img alt=""><button aria-label="Fechar">×</button></dialog>
<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
